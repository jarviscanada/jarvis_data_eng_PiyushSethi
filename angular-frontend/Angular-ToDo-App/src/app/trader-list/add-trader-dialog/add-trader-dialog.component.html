<h1 mat-dialog-title>Add New Trader</h1>
<div mat-dialog-content>
    <mat-form-field class="full-width">
        <mat-label>First Name</mat-label>
        <input matInput [(ngModel)]="trader.firstName">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Last Name</mat-label>
        <input matInput [(ngModel)]="trader.lastName">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Date of Birth</mat-label>
        <input matInput type="date" [(ngModel)]="trader.dob">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Country</mat-label>
        <input matInput [(ngModel)]="trader.country">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="trader.email">
    </mat-form-field>
</div>

<div mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-button color="primary" (click)="onSubmit()">Submit</button>
</div>
